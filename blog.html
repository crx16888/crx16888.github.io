  .blog-compose-button{position:fixed;top:1.25rem;right:1.25rem;z-index:80;display:inline-flex;height:2.75rem;width:2.75rem;align-items:center;justify-content:center;border:1px solid rgba(120,113,108,.28);border-radius:999px;background:rgba(255,255,255,.86);color:#1c1917;box-shadow:0 10px 28px rgba(28,25,23,.12);backdrop-filter:blur(14px);transition:transform .16s ease,border-color .16s ease,box-shadow .16s ease}.blog-compose-button:hover{transform:translateY(-1px);border-color:rgba(28,25,23,.28);box-shadow:0 14px 34px rgba(28,25,23,.16)}.blog-compose-panel{position:fixed;inset:0;z-index:90;display:none;overflow:auto;background:rgba(245,245,244,.78);padding:4.25rem 1rem 2rem;backdrop-filter:blur(18px)}.blog-compose-panel[data-open=true]{display:block}.blog-compose-card{margin:0 auto;max-width:42rem;border:1px solid rgba(214,211,209,.88);border-radius:8px;background:rgba(255,255,255,.94);padding:1.25rem;box-shadow:0 24px 70px rgba(28,25,23,.14)}.blog-compose-row{display:grid;gap:.5rem;margin-top:1rem}.blog-compose-label{font-size:.78rem;font-weight:600;color:#57534e}.blog-compose-input,.blog-compose-textarea{width:100%;border:1px solid #d6d3d1;border-radius:8px;background:#fff;color:#1c1917;font:inherit;font-size:.92rem;line-height:1.55;padding:.7rem .78rem}.blog-compose-textarea{min-height:14rem;resize:vertical}.blog-compose-visibility{display:grid;grid-template-columns:1fr;gap:.65rem}.blog-compose-option{display:flex;gap:.65rem;align-items:flex-start;border:1px solid #e7e5e4;border-radius:8px;padding:.75rem;cursor:pointer}.blog-compose-option strong{display:block;font-size:.9rem;font-weight:600}.blog-compose-option span{display:block;margin-top:.15rem;font-size:.76rem;line-height:1.45;color:#78716c}.blog-compose-actions{display:flex;flex-wrap:wrap;gap:.65rem;justify-content:flex-end;margin-top:1.1rem}.blog-compose-action{border:1px solid #d6d3d1;border-radius:999px;background:#fff;color:#292524;cursor:pointer;font-size:.82rem;font-weight:600;padding:.62rem .92rem}.blog-compose-action[data-primary=true]{border-color:#292524;background:#292524;color:#fff}.blog-posts{margin-top:1.5rem;display:grid;gap:.8rem}.blog-post-card{border:1px solid #e7e5e4;border-radius:8px;background:rgba(255,255,255,.72);padding:1rem}.blog-post-meta{display:flex;flex-wrap:wrap;gap:.45rem;margin-bottom:.45rem;color:#78716c;font-size:.72rem}.blog-post-title{font-size:1rem;font-weight:600;letter-spacing:0}.blog-post-body{margin-top:.55rem;white-space:pre-wrap;color:#57534e;font-size:.88rem;line-height:1.68}.blog-post-tools{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.85rem}.blog-post-tool{border:0;background:transparent;color:#57534e;cursor:pointer;font-size:.76rem;font-weight:600;padding:0;text-decoration:underline;text-underline-offset:3px}.blog-compose-note{margin-top:.9rem;color:#78716c;font-size:.76rem;line-height:1.55}@media (prefers-color-scheme:dark){.blog-compose-button{border-color:rgba(120,113,108,.5);background:rgba(41,37,36,.86);color:#fafaf9}.blog-compose-panel{background:rgba(17,16,16,.78)}.blog-compose-card,.blog-compose-input,.blog-compose-textarea{border-color:#44403c;background:#1c1917;color:#fafaf9}.blog-compose-label,.blog-post-body,.blog-post-tool{color:#d6d3d1}.blog-compose-option,.blog-post-card{border-color:#44403c;background:rgba(28,25,23,.72)}.blog-compose-action{border-color:#57534e;background:#292524;color:#fafaf9}.blog-compose-action[data-primary=true]{border-color:#fafaf9;background:#fafaf9;color:#1c1917}}
</style><button id="blog-compose-button" class="blog-compose-button" type="button" aria-label="Write a new blog post" title="Write a new blog post"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3.5v13M3.5 10h13" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1.8"></path></svg></button><section id="blog-compose-panel" class="blog-compose-panel" aria-hidden="true"><form class="blog-compose-card" id="blog-compose-form"><div style="display:flex;align-items:flex-start;justify-content:space-between;gap:1rem"><div><h2 style="font-size:1.15rem;font-weight:650;letter-spacing:0">写一篇博客</h2><p class="blog-compose-note" style="margin-top:.25rem">内容会先保存在当前浏览器。选择公开后，可导出文件并提交到 GitHub Pages 仓库。</p></div><button class="blog-compose-action" id="blog-compose-close" type="button" aria-label="Close editor">关闭</button></div><label class="blog-compose-row"><span class="blog-compose-label">标题</span><input class="blog-compose-input" name="title" required maxlength="120" placeholder="写一个标题"/></label><label class="blog-compose-row"><span class="blog-compose-label">正文</span><textarea class="blog-compose-textarea" name="body" required placeholder="开始写..."></textarea></label><div class="blog-compose-row"><span class="blog-compose-label">可见性</span><div class="blog-compose-visibility"><label class="blog-compose-option"><input type="radio" name="visibility" value="private" checked/><span><strong>仅我可见</strong><span>只保存在当前浏览器的 localStorage，不会出现在其他设备或访客页面。</span></span></label><label class="blog-compose-option"><input type="radio" name="visibility" value="public"/><span><strong>对大家可见</strong><span>保存为公开草稿，并生成可下载文件；提交到仓库后才会真正公开。</span></span></label></div></div><div id="blog-public-export" class="blog-compose-note" role="status"></div><div class="blog-compose-actions"><button class="blog-compose-action" type="reset">清空</button><button class="blog-compose-action" data-primary="true" type="submit">保存</button></div></form></section><script id="blog-local-editor-script">
(() => {
  const BLOG_STORAGE_KEY = "rx-blog-posts";
  const button = document.getElementById("blog-compose-button");
  const panel = document.getElementById("blog-compose-panel");
  const closeButton = document.getElementById("blog-compose-close");
  const form = document.getElementById("blog-compose-form");
  const exportStatus = document.getElementById("blog-public-export");

  function escapeHtml(value) {
    return value.replace(/[&<>"']/g, (char) => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    })[char]);
  }

  function readPosts() {
    try {
      return JSON.parse(localStorage.getItem(BLOG_STORAGE_KEY) || "[]");
    } catch {
      return [];
    }
  }

  function savePosts(posts) {
    localStorage.setItem(BLOG_STORAGE_KEY, JSON.stringify(posts));
  }

  function formatDate(dateValue) {
    return new Intl.DateTimeFormat("zh-CN", {
      year: "numeric",
      month: "2-digit",
      day: "2-digit",
      hour: "2-digit",
      minute: "2-digit"
    }).format(new Date(dateValue));
  }

  function downloadPublicPost(post) {
    const slug = post.title
      .toLowerCase()
      .replace(/[^a-z0-9\u4e00-\u9fa5]+/gi, "-")
      .replace(/^-+|-+$/g, "")
      .slice(0, 60) || "blog-post";
    const frontMatter = [
      "---",
      `title: ${JSON.stringify(post.title)}`,
      `date: ${post.createdAt}`,
      "visibility: public",
      "---",
      "",
      post.body,
      ""
    ].join("\n");
    const blob = new Blob([frontMatter], { type: "text/markdown;charset=utf-8" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = `${slug}.md`;
    link.click();
    URL.revokeObjectURL(link.href);
  }

  function renderBlogPosts() {
    const blogSection = document.querySelector("main section.sm\\:px-14");
    if (!blogSection) return;

    let postsRoot = blogSection.querySelector("[data-blog-posts]");
    if (!postsRoot) {
      postsRoot = document.createElement("section");
      postsRoot.className = "blog-posts";
      postsRoot.setAttribute("data-blog-posts", "");
      blogSection.appendChild(postsRoot);
    }

    const posts = readPosts().sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
    if (!posts.length) {
      postsRoot.innerHTML = "";
      return;
    }

    postsRoot.innerHTML = posts.map((post) => `
      <article class="blog-post-card" data-post-id="${escapeHtml(post.id)}">
        <div class="blog-post-meta">
          <span>${post.visibility === "public" ? "公开草稿" : "仅我可见"}</span>
          <span>${formatDate(post.createdAt)}</span>
        </div>
        <h2 class="blog-post-title">${escapeHtml(post.title)}</h2>
        <div class="blog-post-body">${escapeHtml(post.body)}</div>
        <div class="blog-post-tools">
          ${post.visibility === "public" ? '<button class="blog-post-tool" data-export-post>导出公开文件</button>' : ""}
          <button class="blog-post-tool" data-delete-post>删除</button>
        </div>
      </article>
    `).join("");

    postsRoot.querySelectorAll("[data-export-post]").forEach((exportButton) => {
      exportButton.addEventListener("click", () => {
        const id = exportButton.closest("[data-post-id]").getAttribute("data-post-id");
        const post = readPosts().find((item) => item.id === id);
        if (post) downloadPublicPost(post);
      });
    });

    postsRoot.querySelectorAll("[data-delete-post]").forEach((deleteButton) => {
      deleteButton.addEventListener("click", () => {
        const id = deleteButton.closest("[data-post-id]").getAttribute("data-post-id");
        savePosts(readPosts().filter((post) => post.id !== id));
        renderBlogPosts();
      });
    });
  }

  function openPanel() {
    panel.dataset.open = "true";
    panel.setAttribute("aria-hidden", "false");
    form.elements.title.focus();
  }

  function closePanel() {
    panel.dataset.open = "false";
    panel.setAttribute("aria-hidden", "true");
  }

  button.addEventListener("click", openPanel);
  closeButton.addEventListener("click", closePanel);
  panel.addEventListener("click", (event) => {
    if (event.target === panel) closePanel();
  });

  form.addEventListener("submit", (event) => {
    event.preventDefault();
    const formData = new FormData(form);
    const post = {
      id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()),
      title: String(formData.get("title")).trim(),
      body: String(formData.get("body")).trim(),
      visibility: String(formData.get("visibility")),
      createdAt: new Date().toISOString()
    };

    if (!post.title || !post.body) return;

    const posts = readPosts();
    posts.push(post);
    savePosts(posts);
    renderBlogPosts();
    form.reset();
    closePanel();

    if (post.visibility === "public") {
      exportStatus.textContent = "已保存为公开草稿。请在列表里点击“导出公开文件”，再提交到仓库发布。";
    } else {
      exportStatus.textContent = "已保存为仅我可见。";
    }
  });

  renderBlogPosts();
})();
</script>
