ng?020d9f90d45085c2\"}],[\"$\",\"meta\",\"15\",{\"property\":\"og:type\",\"content\":\"website\"}],[\"$\",\"meta\",\"16\",{\"name\":\"twitter:card\",\"content\":\"summary_large_image\"}],[\"$\",\"meta\",\"17\",{\"name\":\"twitter:title\",\"content\":\"Hamster1963\"}],[\"$\",\"meta\",\"18\",{\"name\":\"twitter:description\",\"content\":\"Developer, writer, and creator.\"}],[\"$\",\"meta\",\"19\",{\"name\":\"twitter:image:t"])</script><script>self.__next_f.push([1,"ype\",\"content\":\"image/png\"}],[\"$\",\"meta\",\"20\",{\"name\":\"twitter:image:width\",\"content\":\"1920\"}],[\"$\",\"meta\",\"21\",{\"name\":\"twitter:image:height\",\"content\":\"1080\"}],[\"$\",\"meta\",\"22\",{\"name\":\"twitter:image\",\"content\":\"https://nextjs.org/opengraph-image.png?020d9f90d45085c2\"}],[\"$\",\"link\",\"23\",{\"rel\":\"icon\",\"href\":\"/favicon.ico\",\"type\":\"image/x-icon\",\"sizes\":\"16x16\"}],[\"$\",\"meta\",\"24\",{\"name\":\"next-size-adjust\"}]]\n5:null\n"])</script><script>self.__next_f.push([1,"10:I[5814,[\"972\",\"static/chunks/972-101ae44f37c2b91a.js\",\"878\",\"static/chunks/878-356ead56567f1aff.js\",\"404\",\"static/chunks/app/blog/page-aa76dfbfd9fe620a.js\"],\"default\"]\n11:T2910,"])</script><script>self.__next_f.push([1,"## 前言\n\n在博客中，图片的优化是非常值得讨论的话题。\n\n在针对此博客站点中的图片组件进行优化折腾后，\n\n这篇博客将针对\n\n- 构建时优化图片\n- 使用缓存加速构建\n\n这两个方面进行一些分享。\n\n## 优化目标\n\n在网页浏览中，累计布局偏移(CLS)常常会引起不好的用户体验。\n\n[Cumulative Layout Shift (CLS)  |  Articles  |  web.dev](https://web.dev/articles/cls?hl=zh-cn)\n\n而在博客页面中，图片的加载往往会引起这种现象。\n\n![alt: 图片加载导致的布局偏移](/blog-img/image-optimization/CleanShot_2024-08-22_at_11.23.04.gif)\n\n从动图中可以看出，当页面加载完成时，图片尚未加载完成，并且没有宽度与高度的信息，因此在图片完成加载后，图片如同突然出现一样，并且会将所在位置撑开，导致了布局偏移。\n\n这样子会给用户带来非常不好的用户体验：\n\n1. 图片加载没有过渡，视觉体验不好。\n2. 在弱网环境下，用户无法知道是否存在图片。\n\n因此我们可以从三方面去解决这个问题：\n\n- **获取图片的元信息**，获取宽高等必需信息。\n- **为图片生成占位符**，并给图片加载完成加上动画。\n- **压缩图片**，在保证图片质量的同时降低带宽压力。\n\n## 项目架构\n\n首先，目前的博客架构下，每个博客页面都是在构建的时候进行独立生成静态页面，原理是使用 Next.js 中的 generateStaticParams 。\n\n```go\nexport async function generateStaticParams() {\n  let getPost = getBlogPosts()\n  getPost = getPost.filter((post) =\u003e post.metadata.category !== 'Daily')\n\n  return getPost.map((post) =\u003e ({\n    slug: post.slug,\n  }))\n}\n```\n\n在构建过程中，构建器将会针对每一个博客页面，通过 **_next-mdx-remote_** 将 markdown 文件转化为组件树。\n\n```go\nlet components = {\n  h1: CreateHeading(1),\n  h2: CreateHeading(2),\n  h3: CreateHeading(3),\n  h4: CreateHeading(4),\n  h5: CreateHeading(5),\n  h6: CreateHeading(6),\n  img: CenterImage,\n  a: CustomLink,\n  Callout,\n  ProsCard,\n  ConsCard,\n  code: Code,\n  Table,\n  TechCard,\n}\n\nexport function CustomMDX(props) {\n  return (\n    \u003cMDXRemote\n      {...props}\n      components={{ ...components, ...(props.components || {}) }}\n    /\u003e\n  )\n}\n\n```\n\n具体可参考往期文章：\n\n[2024 Blog Refresh](https://buycoffee.top/blog/tech/blog-2024)\n\n在构建过程中，构建器会将 md 文件中的图片转化为自定义的图片组件。\n\n```go\n![Code page (1).png](\u003c/blog-img/blog-2024/Code_page_(1).png\u003e)\n\nasync function CenterImage(props: { src: string; alt: string })\n```\n\n构建器会将图片路径与图片名传入到自定义组件中，因此，我们可以在自定义组件中进行对图片的优化。\n\n优化包含**生成占位符**，**获取图片元信息**与**压缩优化图片**三个步骤。\n\n从整体来看，可以将过程简化为：\n\n![alt: 图片构建时优化过程](/blog-img/image-optimization/Frame_13.png)\n\n### 生成占位符\n\n我们可以采用 Plaiceholder 库来快速为图片生成占位符。\n\n[Plaiceholder](https://plaiceholder.co/docs)\n\n在本项目中，采用提取图片颜色的方式，将颜色作为 div 背景颜色的方式作为占位符。\n\n### 获取图片元信息\n\n在获取占位符的同时，将图片文件的 metadata 也提取出来，其中包含了图片的宽高信息，这是避免布局偏移的核心参数。\n\n![ray-so-export.png](/blog-img/image-optimization/ray-so-export.png)\n\n最终将图片信息与占位符信息作为一个对象返回到组件中。\n\n### 构建博客图片组件\n\n目前，我们已经获取到了图片的宽高信息以及占位符所需要的颜色信息，通过构建一个客户端的图片组件，就可以将信息组合起来，并搭配上图片的加载动画。\n\n\u003e 动画灵感来源于：[https://www.youtube.com/watch?v=7hS9b6n7HrM\u0026t=271s](https://www.youtube.com/watch?v=7hS9b6n7HrM\u0026t=271s)\n\n```go\nconst [isLoading, setIsLoading] = useState(true)\n\n\u003cdiv\n\tclassName=\"absolute inset-0 rounded-lg\"\n\tstyle={{ backgroundColor: hex }}\n/\u003e\n\u003cimg\n\tclassName={cn('relative h-full w-full rounded-lg border border-solid border-neutral-200 object-cover transition-all duration-500 dark:border-neutral-800 dark:brightness-75 dark:hover:brightness-100',\n            isLoading ? 'opacity-0 blur-lg' : 'opacity-100 blur-0')}\n\twidth={width}\n\theight={height}\n\talt={alt}\n\tsrc={src}\n\tonLoad={() =\u003e setIsLoading(false)}\n/\u003e\n```\n\n通过一个 div 配合 backgroundColor 的设置即可为图片增加颜色占位符，而占位符的宽高则取决于图片的宽高，先前在元信息中提取到的宽高信息即可在此使用。\n\n在构建时获取图片信息并设置好宽高数据，可直接避免了图片从未加载到加载后所造成的布局偏移。\n\n在 Next.js 中，'next/image’ 也是通过分析静态导入图片的宽高进行提前设置，从而避免布局偏移的发生。\n\n[Optimizing: Images](https://nextjs.org/docs/app/building-your-application/optimizing/images)\n\n在图片未加载完全时，效果为一个类似色块的占位符。\n\n![alt: 图片未加载完成状态](/blog-img/image-optimization/CleanShot_2024-08-22_at_14.16.252x.png)\n\n此外，通过搭配 onLoad 函数，可以在图片加载完成后进行一些后续操作。使用 useState 在记录图片的加载状态，搭配 css 中的 transition、opacity 与 blur 参数，可以在图片完成加载后，创建一个流畅的过渡效果。\n\n![CleanShot 2024-08-22 at 14.26.50.gif](/blog-img/image-optimization/CleanShot_2024-08-22_at_14.26.50.gif)\n\n完整博客图片组件参考代码如下：\n\n[blog-image.tsx](https://gist.github.com/hamster1963/5c848e47f69d049fb869e375170fc467)\n\n至此，对于布局偏移的图片加载优化的过程就先告一段落了。\n\n接下来，我们还需要对于图片大小进行优化。\n\n### 图片大小优化\n\n对于图片优化，有许多不同的方案，可以使用外部的优化 API，比如\n\n- Vercel Image Optimization\n\n[Image Optimization with Vercel](https://vercel.com/docs/image-optimization)\n\n- Cloudflare Image Optimization\n\n[Overview | Cloudflare Image Optimization docs](https://developers.cloudflare.com/images/)\n\n- Cloudinary\n\n[Image and Video Upload, Storage, Optimization and CDN](https://cloudinary.com/)\n\n这些产品都提供对图片优化的 API 服务，在少量图片的情况下，选用这些产品也可快速优化图片。\n\n但是对于博客站点来说，往往图片的数量并不可控，并且随着博客文章数量的增加，图片的数量也会指数级上涨，因此在本地构建时对图像进行优化，也是一种不错的方案。\n\n在 Next.js 中，内置了图片优化的方式，通过 \\_next/image 路径即可针对图片进行优化，但对于尚存储在本地的图片来说，这种方式并不可用。\n\n但其内核中， 图片优化是采用 sharp 库去进行优化图片的流程的，因此我们也可以在构建时使用 sharp 针对博客内图片进行优化。\n\n```go\nconst originalBuffer = await getFileBufferLocal(imagePath)\nconst optimizedBuffer = await sharp(originalBuffer)\n      .resize(1920, 1080, { fit: 'inside', withoutEnlargement: true })\n      .webp({ quality: 90, lossless: true })\n      .toBuffer()\n```\n\n在代码中，我们通过读取本地图片文件，并通过 sharp 将其转化为 webp 格式（可大大降低图片大小），并通过设置 lossless 与 quality，保证图片质量不会受到太大程度的衰减。\n\n在优化后，重新将其存储到 public 文件夹中，传递新的图片路径给博客图片组件。\n\n```go\n// 保存优化后的图片到 public 目录\nawait fs.writeFile(publicPath, optimizedBuffer)\n```\n\n一切就绪，让我们开始构建吧。\n\n![CleanShot 2024-08-22 at 15.07.24@2x.png](/blog-img/image-optimization/CleanShot_2024-08-22_at_15.07.242x.png)\n\n在经过几次构建后，就会发现一个问题，构建时间真的是太长了。\n\n因此，我们将会针对最后一个问题：**构建性能**，进行优化。\n\n## 构建性能优化\n\n目前，没有做任何优化的情况下，每次构建中，都会针对每一张图片进行上述的优化流程\n\n1. 获取占位符与元信息\n2. 生成优化后图片\n\n因此，每次构建中其实都在重复针对图片进行优化，因此，我们应该将已经优化过的图片与信息缓存起来，在下次构建时从首先从缓存中获取，不存在则再进行优化。\n\n\u003caside\u003e\n💡 需要注意的是，Next.js 的构建缓存路径为 **.next/cache/****\n\n\u003c/aside\u003e\n\n我们将提取的占位符与元信息、优化后的图片一起存储到缓存中。\n\n其中，文件名采用图片路径生成的 MD5 值。\n\n```go\n// 使用文件路径生成 MD5 哈希值\nconst contentHash = crypto.createHash('md5').update(imagePath).digest('hex')\nconst cacheDir = path.join(\n    process.cwd(),\n    '.next',\n    'cache',\n    'optimized-images'\n  )\nconst placeholderCacheFileName = `${contentHash}-placeholder.json`\nconst placeholderCachePath = path.join(cacheDir, placeholderCacheFileName)\n// 保存占位图信息到缓存\nawait fs.mkdir(cacheDir, { recursive: true })\nawait fs.writeFile(placeholderCachePath, JSON.stringify(preImage))\n\n// 保存优化后的图片到缓存目录和 public 目录\nawait fs.writeFile(cachePath, optimizedBuffer)\nawait fs.writeFile(publicPath, optimizedBuffer)\n```\n\n在构建时，在缓存中检索到相同文件名的图片时，就可以将其写入到 public 文件夹中。\n\n```go\n// 如果缓存存在，将其复制到 public 目录\nawait fs.mkdir(publicDir, { recursive: true })\nawait fs.copyFile(cachePath, publicPath)\n```\n\n完整参考代码如下：\n\n[mdx.tsx](https://gist.github.com/hamster1963/eb264f2a8e0f391a40cda75fb27d418a)\n\n通过这种方式，可以大幅降低重复构建时所需的时间与运算性能。\n\n![CleanShot 2024-08-22 at 15.26.30@2x.png](/blog-img/image-optimization/CleanShot_2024-08-22_at_15.26.302x.png)\n\n## 最终效果\n\n在这个过程中，我们对图片进行了用户体验方面以及图片文件大小方面的优化。\n\n在优化后的页面中，每张图片的大小约为 ～100kb 左右，且看起来质量也十分不错。\n\n同时构建后的静态页面中，已嵌入的图片占位符也很好的解决了先前的布局偏移的问题。\n\n欢迎在不同的博客页面中体验这一效果，同时也欢迎打开开发者工具来查看已优化图片的信息。\n\n**Faster than fast.**"])</script><script>self.__next_f.push([1,"12:T15cb,"])</script><script>self.__next_f.push([1,"在前端页面中，性能指标是常常被提及的话题，目前的指标通常由以下几个数据组成：\n\n1. 服务器响应时间：用户访问网站后需要多久时间才会获得响应。\n2. 页面渲染时间：页面完全可见以及可交互所需要的时间。\n3. 用户交互时间：用户在页面上进行关键交互的所需时间。（比如添加商品至购物车）\n\n更详细的介绍可以参考以下两篇 Vercel 官方撰写的博客。\n\n[Guide to fast websites with Next.js: Tips for maximizing server speeds and minimizing client burden – Vercel](https://vercel.com/blog/guide-to-fast-websites-with-next-js-tips-for-maximizing-server-speeds)\n\n[Speed Insights Overview](https://vercel.com/docs/speed-insights)\n\n## 目标优化站点\n\n通常在页面开发过程中，我们可以采用[https://pagespeed.web.dev/](https://pagespeed.web.dev/)或 Chrome 浏览器中自带的 Lighthouse 来进行页面性能的简单测试。\n\n这是我们未优化的页面：\n\n![Untitled](/blog-img/first-load-js/Untitled.png)\n\n可以看到目前站点首屏的 Lighthouse 性能测试中，**LCP(Largest Contentful Paint)** 与 **Speed Index** 两项指标的表现并不是很好。\n\n在进行全部的优化之前，先让我们看一下构建的日志结果。\n\n![Untitled](/blog-img/first-load-js/Untitled%201.png)\n\n不难看出，在构建结果中，首屏的页面大小（Size）与首次需要加载的 JS 大小（First Load JS）相对于其他的页面突出不少，而页面大小与 First Load JS 与 **LCP(Largest Contentful Paint)** 的分数息息相关。因此我们先对首屏的 JS 大小进行分析。\n\n## 分析首屏 JS\n\n站点使用 Next.js 进行构建，可以通过 `@next/bundle-analyzer` 包来进行 JS 捆绑包的分析。\n\n```bash\nbun i @next/bundle-analyzer\n```\n\n在项目根目录下的 `next.config.mjs` 中进行分析的配置。\n\n```jsx\nimport withBundleAnalyzer from '@next/bundle-analyzer'\n\nconst bundleAnalyzer = withBundleAnalyzer({\n  enabled: process.env.ANALYZE === 'true',\n})\n\n/** @type {import('next').NextConfig} */\nconst nextConfig = {\n  output: 'export',\n  experimental: {\n    optimisticClientCache: true,\n    swcMinify: true,\n    gzipSize: true,\n    taint: true,\n  },\n}\nexport default bundleAnalyzer(nextConfig)\n```\n\n配置完成后，通过设置环境变量`ANALYZE`进行使用 bundle-analyzer 分析的构建:\n\n```bash\nANALYZE=true bun run build\n```\n\n在构建过程中，浏览器会自动打开三个页面。\n\n1. nodejs.html 显示服务器端的所有捆绑包。\n2. edge.html 显示在边缘计算中的所有捆绑包。\n3. client.html 显示客户端的所有捆绑包。\n\n_在本项目中，由于是采用静态部署，因此通过分析 client.html 即可。_\n\n首先在看看首页的组件构成：\n\n![Untitled](/blog-img/first-load-js/Untitled%202.png)\n\n主要由网络信息图表，订阅列表以及服务器列表构成。\n\n在 client.html 中，筛选出首页：\n\n![Untitled](/blog-img/first-load-js/Untitled%203.png)\n\n分析页面上显示的捆绑包，所占的面积越大，表示捆绑包越大。\n\n![Untitled](/blog-img/first-load-js/Untitled%204.png)\n\n不难看出，recharts 包所占的空间不小，而此包主要用于网络速率显示图表中：\n\n![Untitled](/blog-img/first-load-js/Untitled%205.png)\n\n因此可以通过优化此部分的组件内包导入来优化 First Load JS。\n\n## 优化包导入\n\n在官方的最佳实践中，我们可以采用 **Lazy Loading** 的方式，尽可能延迟那些比较重的依赖包。\n\n[Optimizing: Lazy Loading](https://nextjs.org/docs/app/building-your-application/optimizing/lazy-loading)\n\n动态导入是其中的一种方式，原理十分简单，在初次获取页面时，并不会去获取需要动态导入的依赖包，只有在页面加载后，才会根据条件去进行获取依赖包，这对于大型网站的优化十分有用，比如需要用户点击后才会出现的图表，或者是需要登录后才会显示的一些用户组件，这些都是无需在第一次获取页面时就去下载的数据，因此都可以使用动态导入来进行优化。\n\n![Untitled](/blog-img/first-load-js/Untitled%206.png)\n\n那就着手优化，这是优化前的组价导入：\n\n```tsx\nimport NetworkChart from '@/components/NetworkChart'\n```\n\n将其改成动态导入，并且加上一个骨架进行占位显示：\n\n```tsx\nimport dynamic from 'next/dynamic'\nconst NetworkChart = dynamic(() =\u003e import('@/components/NetworkChart'), {\n  ssr: false,\n  loading: () =\u003e \u003cSkeleton className=\"mt-2 h-[80px] w-full rounded-[10px]\" /\u003e,\n})\n```\n\n这样子，在页面初次加载的时候，就不用加载 recharts 依赖包，而是等到页面加载后，再进行下载，同时骨架使得页面的 Cumulative Layout Shift 保持较低的水平。\n\n![Untitled](/blog-img/first-load-js/Untitled%207.png)\n\n使用动态导入后，重新进行构建：\n\n![Untitled](/blog-img/first-load-js/Untitled%208.png)\n\n可以看到，Size 从 115kB → 7.63kB ，同时 FLJ 也从 267kB → 159kb，使用动态导入后优化效果十分显著。\n\n重新进行 Lighthouse 的测试，可以发现 LCP 也从先前的 4.6s 优化到1.6s。\n\n![Untitled](/blog-img/first-load-js/Untitled%209.png)\n\n欢迎访问页面来试试首屏显示的速度。\n\n[HomeDash](https://dash.buycoffee.top/)\n\n## 结论\n\n在优化首屏显示中，通过将一些比较重的依赖包采用动态导入的方式进行导入，不仅优化了页面大小也优化了初次加载 JS 大小，使得页面在初次加载的时候速度更快。"])</script><script>self.__next_f.push([1,"13:[[\"image-optimization\",{\"slug\":\"image-optimization\",\"src\":\"/blog-img/image-optimization/cover.webp\",\"metadata\":{\"width\":1469,\"height\":821,\"format\":\"webp\",\"size\":37432,\"space\":\"srgb\",\"channels\":3,\"depth\":\"uchar\",\"isProgressive\":false,\"hasProfile\":false,\"hasAlpha\":false},\"placeholder\":{\"r\":248,\"g\":248,\"b\":248,\"hex\":\"#f8f8f8\"}}],[\"first-load-js\",{\"slug\":\"first-load-js\",\"src\":\"/blog-img/first-load-js/cover.webp\",\"metadata\":{\"width\":1920,\"height\":1080,\"format\":\"webp\",\"size\":36312,\"space\":\"srgb\",\"channels\":3,\"depth\":\"uchar\",\"isProgressive\":false,\"hasProfile\":false,\"hasAlpha\":false},\"placeholder\":{\"r\":8,\"g\":8,\"b\":8,\"hex\":\"#080808\"}}]]\nf:[\"$\",\"$L10\",null,{\"firstBlog\":{\"metadata\":{\"title\":\"Blog Image Optimization\",\"publishedAt\":\"2024-08-22\",\"summary\":\"Image Optimization\",\"image\":\"/blog-img/image-optimization/cover.webp\",\"rssImage\":\"/blog-img/image-optimization/cover.jpeg\",\"category\":\"Tech\",\"ai\":\"博客分享了如何通过优化图片加载和缓存来提升博客页面的用户体验与构建速度。\"},\"slug\":\"image-optimization\",\"tweetIds\":[],\"content\":\"$11\"},\"restBlogs\":[{\"metadata\":{\"title\":\"First Load JS Optimization\",\"publishedAt\":\"2024-04-25\",\"summary\":\"First Load JS\",\"image\":\"/blog-img/first-load-js/cover.webp\",\"rssImage\":\"/blog-img/first-load-js/cover.jpeg\",\"category\":\"Tech\",\"ai\":\"本文介绍了如何通过动态导入优化前端页面性能，特别是减少首屏加载时间。作者通过Next.js框架和@next/bundle-analyzer工具，分析并优化了首屏JavaScript的大小。采用懒加载技术，延迟了重大依赖包的加载，显著提高了页面的加载速度和性能，尤其是在图表显示等重组件上的应用。文中还展示了优化前后的对比数据，验证了优化措施的有效性。\"},\"slug\":\"first-load-js\",\"tweetIds\":[],\"content\":\"$12\"}],\"placeholderImageBlogMap\":\"$Q13\"}]\n"])</script></body></html>
